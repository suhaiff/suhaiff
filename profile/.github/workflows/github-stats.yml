name: GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: cyb3r-jak3/github-readme-stats-action@main
        with:
          card: stats
          options: username=suhaiff&show_icons=true&hide_border=true&bg_color=050810&title_color=2ADCFF&text_color=E5EEFC&icon_color=B05BFF
          path: profile/stats.svg

      - name: Generate Top Languages
        uses: cyb3r-jak3/github-readme-stats-action@main
        with:
          card: top-langs
          options: username=suhaiff&layout=donut&langs_count=6&hide_border=true&bg_color=050810&title_color=2ADCFF&text_color=E5EEFC
          path: profile/top-langs.svg

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --cached --quiet || git commit -m "Update GitHub stats"
          git push
